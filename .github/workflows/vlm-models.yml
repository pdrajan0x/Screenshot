name: Mirror AI model

# Copies the on-device AI model both apps use (LFM2.5-VL 1.6B: language model + vision projector)
# from Hugging Face into a GitHub release with SHA-256 and sizes: the apps' second download source.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vlm-models.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download models
        run: |
          set -euo pipefail
          mkdir -p models && cd models
          # repo  file-pattern (first match wins, in order)
          fetch() {
            local repo="$1"; shift
            local files
            if ! files=$(curl -fsSL "https://huggingface.co/api/models/$repo" | python3 -c "import sys,json; print('\n'.join(s['rfilename'] for s in json.load(sys.stdin)['siblings']))"); then
              echo "== $repo not found, skipped"; return 0
            fi
            echo "== $repo"; echo "$files"
            for pattern in "$@"; do
              local name
              name=$(echo "$files" | grep -iE "$pattern" | head -1 || true)
              if [ -n "$name" ]; then
                echo "-> $name"
                curl -fL --retry 4 -o "$(basename "$name")" "https://huggingface.co/$repo/resolve/main/$name"
                return 0
              fi
            done
            echo "no file matched in $repo: $*"
          }
          # Keep the file names: the apps download them from this release (see Models in ModelDownloader.kt).
          fetch LiquidAI/LFM2.5-VL-1.6B-GGUF '^LFM2\.5-VL-1\.6B-Q4_0\.gguf$'
          fetch LiquidAI/LFM2.5-VL-1.6B-GGUF '^mmproj-LFM2\.5-VL-1\.6b-Q8_0\.gguf$'
          # Both files or nothing: the release is only replaced when the mirror is complete.
          test -s LFM2.5-VL-1.6B-Q4_0.gguf && test -s mmproj-LFM2.5-VL-1.6b-Q8_0.gguf
          ls -l
          sha256sum *.gguf | tee SHA256SUMS.txt
          stat -c '%n %s' *.gguf | tee SIZES.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vlm-models-v1"
          gh release delete "$tag" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" models/*.gguf models/SHA256SUMS.txt models/SIZES.txt \
            -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "On-device AI model (mirror)" \
            --notes "$(cat models/SHA256SUMS.txt; echo; cat models/SIZES.txt)"
