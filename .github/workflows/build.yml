name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Export MobileCLIP2-S0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exported model
        id: cache
        uses: actions/cache@v4
        with:
          path: model-out
          key: clip-${{ hashFiles('tools/model/export_mobileclip.py', 'tools/model/requirements.txt') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r tools/model/requirements.txt
          python tools/model/export_mobileclip.py --out model-out

      - uses: actions/upload-artifact@v4
        with:
          name: clip-model
          path: model-out
          retention-days: 3

  android:
    name: Build APK
    needs: [model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clip-model
          path: model-out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      # Release APKs must keep the same signature so updates install over the old app.
      # Preferred: repository secrets SIGNING_KEYSTORE_BASE64 + SIGNING_PASSWORD.
      # Otherwise a key is generated once and kept in the Actions cache (never in git).
      - name: Restore cached signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.dot-signing
          key: dot-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          dir="$HOME/.dot-signing"
          mkdir -p "$dir"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$dir/secret.jks"
            store="$dir/secret.jks"; pass="$KEYSTORE_PASSWORD"
          else
            if [ ! -f "$dir/cached.jks" ]; then
              openssl rand -hex 24 > "$dir/cached.pass"
              keytool -genkeypair -keystore "$dir/cached.jks" -storetype PKCS12 -alias dot \
                -keyalg RSA -keysize 2048 -validity 36500 \
                -storepass "$(cat "$dir/cached.pass")" -keypass "$(cat "$dir/cached.pass")" \
                -dname "CN=Dot Apps"
            fi
            store="$dir/cached.jks"; pass="$(cat "$dir/cached.pass")"
          fi
          echo "::add-mask::$pass"
          {
            echo "DOT_SIGNING_STORE=$store"
            echo "DOT_SIGNING_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Test engine and model parity
        run: ./gradlew :core:engine:test --stacktrace

      - name: Check regexes compile on Android's ICU engine
        run: |
          ls /usr/lib/x86_64-linux-gnu/libicui18n.so.* >/dev/null 2>&1 || sudo apt-get install -y -q libicu-dev
          python3 tools/check_android_regex.py

      - name: Build Dot Screenshots
        run: |
          set -o pipefail
          ./gradlew :app-screenshots:assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app-screenshots/build/outputs/apk/release/*.apk dist/DotScreenshots.apk
          # R8 mappings, to turn obfuscated stack traces from the phone back into real names.
          cp app-screenshots/build/outputs/mapping/release/mapping.txt dist/DotScreenshots-mapping.txt
          ls -la dist

      - name: Check ML Kit survived R8
        run: |
          pip install --quiet androguard
          python3 - <<'PY'
          import re, sys
          from loguru import logger
          logger.remove()
          from androguard.misc import AnalyzeAPK
          ok = True
          for apk in ["dist/DotScreenshots.apk"]:
              a, dexes, _ = AnalyzeAPK(apk)
              manifest = a.get_android_manifest_axml().get_xml().decode()
              classes = {c.name: c for d in dexes for c in d.get_classes()}
              for reg in re.findall(r"com\.google\.firebase\.components:([\w.]+)", manifest):
                  c = classes.get("L" + reg.replace(".", "/") + ";")
                  has_init = c is not None and any(m.name == "<init>" and m.get_descriptor() == "()V" for m in c.get_methods())
                  print(apk, reg, "OK" if has_init else "MISSING no-arg constructor")
                  ok &= has_init
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist
          retention-days: 14

      - name: Show compiler errors
        if: failure()
        run: |
          echo "==================== BUILD ERRORS ===================="
          grep -E "^e: |^w: .*(error|unresolved)|error:|What went wrong|Could not resolve|> Could not|FAILED" -A2 build.log | grep -v "^--$" | head -200 || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" dist/*.apk dist/*-mapping.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dot Screenshots — latest build (${GITHUB_REF_NAME})" \
            --notes "Built from ${GITHUB_SHA}. Download the APK on your phone and open it to install or update."
