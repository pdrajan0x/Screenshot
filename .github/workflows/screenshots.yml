name: README screenshots

# Run by hand: builds the app for an x86_64 emulator, captures its main screens with a few sample
# screenshots (tools/screenshots/take.py) and commits them to docs/screenshots for the README.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The same app built for x86_64: the emulator runs it natively (the ARM build would be translated, far too slowly).
      - name: Build for the emulator
        run: |
          ./gradlew :app-screenshots:assembleRelease -Pdot.abi=x86_64 --console=plain
          cp app-screenshots/build/outputs/apk/release/*.apk DotScreenshots.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 -u tools/screenshots/take.py docs/screenshots DotScreenshots.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screenshots
          path: docs/screenshots

      - name: Commit the screenshots
        run: |
          rm -f docs/screenshots/debug-*.png
          git config user.name "pdrajan0x"
          git config user.email "itspdrajan@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "README: app screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
