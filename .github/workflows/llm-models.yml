name: Mirror LLM models

# Copies the on-device summary models from Hugging Face into a GitHub release (with SHA-256),
# so the app has a second download source and the files can be inspected/tested elsewhere.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/llm-models.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download models
        run: |
          set -euo pipefail
          mkdir -p models && cd models
          curl -fL --retry 4 -o Qwen3-1.7B-Q4_0.gguf \
            "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_0.gguf"
          curl -fL --retry 4 -o qwen2.5-1.5b-instruct-q4_0.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_0.gguf"
          ls -l
          sha256sum *.gguf | tee SHA256SUMS.txt
          stat -c '%n %s' *.gguf | tee SIZES.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="llm-models-v1"
          gh release delete "$tag" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$tag" models/*.gguf models/SHA256SUMS.txt models/SIZES.txt \
            -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "On-device summary models (mirror)" \
            --notes "$(cat models/SHA256SUMS.txt; echo; cat models/SIZES.txt)"
